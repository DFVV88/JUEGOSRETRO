name: Deploy JUEGOS RETRO to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude '.git' \
            --exclude '_site' \
            --exclude '.boxedwine-download' \
            --exclude 'runtime' \
            ./ _site/

          touch _site/.nojekyll

      - name: Download BoxedWine 26R1 Web
        shell: bash
        run: |
          set -euo pipefail

          BOXEDWINE_URL="https://github.com/danoon2/Boxedwine/releases/download/26R1.0/Boxedwine26R1Web.zip"
          mkdir -p /tmp/boxedwine-release
          curl -L --fail --retry 3 --retry-delay 2 \
            "$BOXEDWINE_URL" \
            -o /tmp/Boxedwine26R1Web.zip

          unzip -q /tmp/Boxedwine26R1Web.zip -d /tmp/boxedwine-release

          echo "BoxedWine web builds found:"
          find /tmp/boxedwine-release -type f -name boxedwine.html -print

          BW_HTML="$(find /tmp/boxedwine-release -type f -path '*/SingleThreaded/boxedwine.html' | head -n 1 || true)"
          if [ -z "$BW_HTML" ]; then
            BW_HTML="$(find /tmp/boxedwine-release -type f -name boxedwine.html | grep -v '/MultiThreaded' | head -n 1 || true)"
          fi
          if [ -z "$BW_HTML" ]; then
            echo "ERROR: no se encontró boxedwine.html"
            exit 1
          fi

          BW_DIR="$(dirname "$BW_HTML")"
          echo "Using BoxedWine runtime: $BW_DIR"

          mkdir -p _site/runtime/boxedwine
          cp -a "$BW_DIR"/. _site/runtime/boxedwine/

          if [ ! -f _site/runtime/boxedwine/boxedwine.zip ]; then
            ROOT_ZIP="$(find /tmp/boxedwine-release -type f -name boxedwine.zip | head -n 1 || true)"
            if [ -n "$ROOT_ZIP" ]; then
              cp "$ROOT_ZIP" _site/runtime/boxedwine/boxedwine.zip
            fi
          fi

          if [ ! -f _site/runtime/boxedwine/boxedwine.zip ]; then
            echo "ERROR: no se encontró boxedwine.zip"
            exit 1
          fi

          cp assets/js/boxedwine-bridge.js _site/runtime/boxedwine/jr-bridge.js

      - name: Install JUEGOS RETRO bridge in BoxedWine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("_site/runtime/boxedwine/boxedwine.html")
          html = path.read_text(encoding="utf-8", errors="replace")
          bridge = '<script src="jr-bridge.js"></script>'

          if bridge not in html:
              needle = '<script src="boxedwine-shell.js"></script>'
              if needle in html:
                  html = html.replace(needle, bridge + "\n        " + needle, 1)
              elif "</head>" in html:
                  html = html.replace("</head>", "  " + bridge + "\n  </head>", 1)
              else:
                  html = bridge + "\n" + html

          path.write_text(html, encoding="utf-8")
          print("Bridge injected:", path)
          PY

          echo "Runtime files:"
          du -sh _site/runtime/boxedwine
          ls -lh _site/runtime/boxedwine | head -40

      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/play/ignition.html
          test -f _site/runtime/boxedwine/boxedwine.html
          test -f _site/runtime/boxedwine/boxedwine.js
          test -f _site/runtime/boxedwine/boxedwine.wasm
          test -f _site/runtime/boxedwine/boxedwine.zip
          test -f _site/runtime/boxedwine/jr-bridge.js
          grep -q "jr-bridge.js" _site/runtime/boxedwine/boxedwine.html
          echo "JUEGOS RETRO build valid."

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
